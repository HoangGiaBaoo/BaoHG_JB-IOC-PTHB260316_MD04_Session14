server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      # Dùng chung Redis với Identity-Service
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/products/**

